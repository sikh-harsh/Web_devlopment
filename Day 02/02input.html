<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Username</label>
    <input placeholder="Enter your Name">

    <!-- Input Type -->
     <!-- abs@xyz.com -->

     <input type="text" placeholder="username"><br><br>
     <input type="email" placeholder="abc@xyz.com"><br><br>


     <input type="password" placeholder="********"><br><br>
     
     <input type="url" placeholder="http://yoursite.com"><br><br>

     <input type="tel" placeholder="+91 9867574596"><br><br>

     <!-- Date and Time -->
      <input type="date">
      <input type="time">


      <input type="datetime-local">
      <input type="month">
      <input type="week">
      
      <!-- Selection Box -->
       <input type="checkbox">
       <label>I agree to terms and condition</label>


       <!-- Special Input -->
        <input type="file" >
        <input type="color">
        <input type="range">
        <input type="number" placeholder="number">
        

        <!-- validation -->
         <input type="text" placeholder="name" required>

         <input type="text" placeholder="username" minlength="3" maxlength="10"><br><br>
        <input type="tel" placeholder="phone number" pattern="[0-9]{10}"><br><br>

        <!-- Feedback and review -->
         <textarea rows="5" column="20" placeholder="feedback"></textarea>


</body>
</html>
