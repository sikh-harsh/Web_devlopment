<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- tr = table heading , th = table rows ,td = table data-->
     <!-- cellpadding = space inside the cell in all direction -->
    <table border="1" cellspacing="10" cellpadding="5" align="center" bgcolor="green">
        <thead bgcolor="yellow" align="center">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
                <th>Salary</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody bgcolor="pink" align="center">
            <tr>
                <td>Girish</td>
                <td>29</td>
                <td>Banglore</td>
                <td>70,000</td>
                <td>
                    <button>Edit</button>
                    <button>Delete</button>
                </td>

            </tr>
            <tr>
                <td>Simran</td>
                <td>20</td>
                <td>Delhi</td>
                <td>20,000</td>
                <td>
                    <button>Edit</button>
                    <button>Delete</button>
                </td>

            </tr>

        </tbody>
    </table>
    
</body>
</html>
